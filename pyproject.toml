[project]
name = "scwiki"
version = "0.1.0"
description = "Python client for the Star Citizen Wiki API with version-aware caching and pluggable HTTP transports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Garulf" }]
keywords = ["star-citizen", "api", "client", "wiki", "cache"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
aiohttp = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/Garulf/scwiki"
Issues = "https://github.com/Garulf/scwiki/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "tox>=4",
  "tox-uv>=1",
  "pre-commit>=3",
  "httpx>=0.27",
  "aiohttp>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scwiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["network: hits the live API, enable with SCWIKI_NETWORK=1"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["aiohttp.*"]
ignore_missing_imports = true
